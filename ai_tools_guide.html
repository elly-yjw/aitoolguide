<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工具选型指南</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --surface-2: #f4f3ef;
    --border: #e8e6df;
    --border-2: #d5d2c8;
    --text: #1a1917;
    --text-2: #5c5a54;
    --text-3: #9b9890;
    --shadow: 0 10px 28px rgba(26, 25, 23, 0.06);
    --radius: 10px;

    --slate-bg: #f0efe8; --slate-mid: #7a786e; --slate-text: #3c3b36;
    --blue-bg: #e8f1fb; --blue-mid: #3578d4; --blue-text: #0d3d7a;
    --teal-bg: #e0f5ee; --teal-mid: #1a9e75; --teal-text: #085041;
    --purple-bg: #eeedfe; --purple-mid: #6259c4; --purple-text: #3a2e8e;
    --amber-bg: #fef3da; --amber-mid: #c98a18; --amber-text: #6b4408;
    --coral-bg: #faede8; --coral-mid: #c45a35; --coral-text: #7a2e14;
    --pink-bg: #fceaf2; --pink-mid: #c24880; --pink-text: #7a1f4a;
    --green-bg: #ebf5dc; --green-mid: #4b7e18; --green-text: #274409;
  }

  html { font-size: 15px; scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    line-height: 1.6;
  }

  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px 48px;
  }

  .header-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }

  .header {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 24px 22px;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: nowrap;
  }

  .header-main {
    flex: 1 1 auto;
    min-width: 0;
  }

  .eyebrow {
    color: var(--text-3);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-family: 'DM Mono', monospace;
  }

  h1 {
    font-size: 1.88rem;
    line-height: 1.18;
    margin-bottom: 10px;
    letter-spacing: 0;
  }

  .subtitle {
    color: var(--text-2);
    font-size: 0.9rem;
    max-width: 900px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-meta {
    flex: 0 0 260px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .meta-block {
    color: var(--text-3);
    font-size: 0.74rem;
    line-height: 1.7;
    text-align: right;
    font-family: 'DM Mono', monospace;
  }

  .lang-switch {
    display: inline-flex;
    gap: 6px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-2);
  }

  .lang-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-2);
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }

  .lang-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .hero-note {
    margin-top: 18px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .hero-note-card {
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }

  .hero-note-title {
    font-size: 0.74rem;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 5px;
    font-weight: 700;
  }

  .hero-note p {
    color: var(--text-2);
    font-size: 0.78rem;
    line-height: 1.5;
  }

  .nav-wrap {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .nav {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav::-webkit-scrollbar { display: none; }

  .nav-item {
    flex-shrink: 0;
    padding: 13px 14px;
    font-size: 0.8rem;
    color: var(--text-2);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .nav-item.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  .nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .overview-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }

  .overview-block {
    margin-bottom: 18px;
  }

  .overview-block-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .overview-block-title {
    font-size: 0.92rem;
    font-weight: 700;
  }

  .overview-block-sub {
    color: var(--text-2);
    font-size: 0.76rem;
  }

  .overview-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
  }

  .overview-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }

  .overview-panel-title {
    font-size: 0.9rem;
    font-weight: 700;
  }

  .overview-panel-sub {
    color: var(--text-2);
    font-size: 0.76rem;
  }

  .overview-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .overview-table th,
  .overview-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    text-align: left;
  }

  .overview-table tr:last-child td {
    border-bottom: 0;
  }

  .overview-table th {
    color: var(--text-3);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(244, 243, 239, 0.45);
  }

  .overview-table td {
    font-size: 0.78rem;
  }

  .overview-row-cat {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .overview-row-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent, var(--slate-mid));
  }

  .overview-row-name {
    font-weight: 700;
  }

  .overview-row-desc {
    color: var(--text-2);
    line-height: 1.5;
  }

  .overview-row-picks {
    color: var(--text);
    line-height: 1.5;
  }

  .overview-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .overview-card:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow);
    border-color: var(--border-2);
  }

  .overview-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    border-radius: 10px 0 0 10px;
    background: var(--accent, var(--slate-mid));
  }

  .overview-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--accent-bg, var(--surface-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    flex-shrink: 0;
  }

  .overview-name {
    font-size: 0.92rem;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .overview-text {
    min-width: 0;
  }

  .overview-sub {
    color: var(--text-2);
    font-size: 0.75rem;
    line-height: 1.4;
    max-width: 40ch;
  }

  .overview-count {
    color: var(--text-2);
    font-size: 0.72rem;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
    padding: 5px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    align-self: flex-start;
  }

  .section {
    display: none;
  }

  .section.active {
    display: block;
  }

  .section-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .section-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--accent-bg, var(--surface-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }

  .section-title {
    font-size: 1.22rem;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .section-desc {
    color: var(--text-2);
    font-size: 0.84rem;
  }

  .when-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    margin: 16px 0 10px;
  }

  .when-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .when-chip {
    border: 1px solid var(--border-2);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 0.72rem;
    color: var(--text-2);
    background: var(--surface);
  }

  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
    gap: 12px;
  }

  .tool-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    overflow: hidden;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .tool-card:hover {
    border-color: var(--border-2);
    box-shadow: var(--shadow);
  }

  .tool-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent, var(--slate-mid));
  }

  .tool-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .tool-id {
    display: flex;
    gap: 12px;
    align-items: center;
    min-width: 0;
  }

  .tool-logo {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    object-fit: cover;
    flex-shrink: 0;
  }

  .tool-name {
    font-size: 0.92rem;
    font-weight: 700;
    line-height: 1.35;
  }

  .tool-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .badge {
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 0.66rem;
    font-weight: 600;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .badge-top { background: var(--amber-bg); color: var(--amber-text); border-color: #eec97a; }
  .badge-cn { background: var(--blue-bg); color: var(--blue-text); border-color: #7aaeee; }
  .badge-open { background: var(--teal-bg); color: var(--teal-text); border-color: #7ed2bb; }
  .badge-enterprise { background: var(--purple-bg); color: var(--purple-text); border-color: #aaa4ec; }
  .badge-new { background: var(--coral-bg); color: var(--coral-text); border-color: #eaa48a; }
  .badge-local { background: var(--slate-bg); color: var(--slate-text); border-color: #b8b5aa; }

  .tool-desc {
    font-size: 0.79rem;
    color: var(--text-2);
    line-height: 1.58;
    margin-bottom: 12px;
  }

  .tool-detail {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    display: grid;
    gap: 7px;
  }

  .detail-row {
    display: grid;
    grid-template-columns: 46px 1fr;
    gap: 8px;
    font-size: 0.75rem;
    line-height: 1.5;
  }

  .detail-label {
    color: var(--text-3);
    font-weight: 700;
  }

  .detail-val {
    color: var(--text-2);
  }

  .decision-section {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .decision-title {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    margin-bottom: 10px;
  }

  .decision-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .decision-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }

  .decision-q {
    font-size: 0.78rem;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .decision-a {
    color: var(--text-2);
    font-size: 0.75rem;
    line-height: 1.55;
  }

  .decision-a strong {
    color: var(--text);
  }

  .footer {
    max-width: 1240px;
    margin: 34px auto 0;
    padding: 18px 24px 32px;
    border-top: 1px solid var(--border);
    color: var(--text-3);
    font-size: 0.72rem;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-family: 'DM Mono', monospace;
  }

  @media (max-width: 900px) {
    .header-top {
      flex-wrap: wrap;
    }

    .header-meta {
      flex: 1 1 100%;
      min-width: 0;
      align-items: flex-start;
    }

    .hero-note {
      grid-template-columns: 1fr;
    }

    .overview-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .decision-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 700px) {
    .page, .header, .nav {
      padding-left: 16px;
      padding-right: 16px;
    }

    .header-top {
      flex-direction: column;
      align-items: flex-start;
    }

    .header-meta {
      flex: 1 1 auto;
      min-width: 0;
      align-items: flex-start;
    }

    .subtitle {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    .overview-grid {
      grid-template-columns: 1fr;
    }

    .overview-table,
    .overview-table thead,
    .overview-table tbody,
    .overview-table tr,
    .overview-table th,
    .overview-table td {
      display: block;
      width: 100%;
    }

    .overview-table thead {
      display: none;
    }

    .overview-table td {
      padding-top: 8px;
      padding-bottom: 8px;
      border-bottom: 0;
    }

    .overview-table tr {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .tool-grid {
      grid-template-columns: 1fr;
    }
  }

  @media print {
    .nav-wrap { position: static; backdrop-filter: none; }
    .section { display: block !important; page-break-inside: avoid; }
    .section + .section { page-break-before: always; }
  }
</style>
</head>
<body>
  <div class="header-wrap">
    <div class="header">
      <div class="header-top">
        <div class="header-main">
          <div class="eyebrow" id="eyebrow">AI Tool Selector Guide</div>
          <h1 id="page-title"></h1>
          <p class="subtitle" id="page-subtitle"></p>
        </div>
        <div class="header-meta">
          <div class="lang-switch" aria-label="Language switch">
            <button class="lang-btn active" data-lang="zh">中文</button>
            <button class="lang-btn" data-lang="en">English</button>
          </div>
          <div class="meta-block" id="meta-block"></div>
        </div>
      </div>
      <div class="hero-note">
        <div class="hero-note-card">
          <div class="hero-note-title" id="hero-note-title-1"></div>
          <p id="hero-note-body-1"></p>
        </div>
        <div class="hero-note-card">
          <div class="hero-note-title" id="hero-note-title-2"></div>
          <p id="hero-note-body-2"></p>
        </div>
        <div class="hero-note-card">
          <div class="hero-note-title" id="hero-note-title-3"></div>
          <p id="hero-note-body-3"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-wrap">
    <div class="nav" id="nav"></div>
  </div>

  <div class="page">
    <div id="tab-overview" class="section active">
      <div class="overview-block">
        <div class="overview-block-head">
          <div>
            <div class="overview-block-title" id="featured-block-title"></div>
            <div class="overview-block-sub" id="featured-block-sub"></div>
          </div>
        </div>
        <div class="overview-grid" id="overview-grid"></div>
      </div>
      <div class="overview-panel">
        <div class="overview-panel-head">
          <div>
            <div class="overview-panel-title" id="overview-panel-title"></div>
            <div class="overview-panel-sub" id="overview-panel-sub"></div>
          </div>
        </div>
        <table class="overview-table">
          <thead>
            <tr>
              <th id="overview-head-1"></th>
              <th id="overview-head-2"></th>
              <th id="overview-head-3"></th>
            </tr>
          </thead>
          <tbody id="overview-table-body"></tbody>
        </table>
      </div>
      <div class="decision-section">
        <div class="decision-title" id="quick-title"></div>
        <div class="decision-grid" id="quick-grid"></div>
      </div>
    </div>
    <div id="sections-root"></div>
  </div>

  <div class="footer">
    <span id="footer-left"></span>
    <span id="footer-mid"></span>
    <span id="footer-right"></span>
  </div>

<script>
const uiText = {

function favicon(domain) {
  return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
}

for (const category of categories) {
  for (const tool of category.tools) {
    if (!tool.logo) tool.logo = favicon(tool.domain);
  }
}

let currentLang = 'zh';
const featuredOverviewIds = ['assistants', 'search', 'docs', 'content', 'coding', 'agents'];

function t(value) {
  if (!value) return '';
  return typeof value === 'string' ? value : value[currentLang];
}

function badgeClass(type) {
  const map = {
    top: 'badge-top',
    cn: 'badge-cn',
    open: 'badge-open',
    enterprise: 'badge-enterprise',
    new: 'badge-new',
    local: 'badge-local'
  };
  return map[type] || 'badge-local';
}

function badgeLabel(type) {
  const labels = {
    zh: {
      top: '推荐',
      cn: '中文',
      open: '开放',
      enterprise: '企业',
      new: '新兴',
      local: '本地'
    },
    en: {
      top: 'Top Pick',
      cn: 'China',
      open: 'Open',
      enterprise: 'Enterprise',
      new: 'New',
      local: 'Local'
    }
  };
  return labels[currentLang][type] || type;
}

function toolCard(tool, accent) {
  const badges = (tool.badges || []).map(tag =>
    `<span class="badge ${badgeClass(tag)}">${badgeLabel(tag)}</span>`
  ).join('');
  return `
    <div class="tool-card" style="--accent:${accent}">
      <div class="tool-top">
        <div class="tool-id">
          <img class="tool-logo" src="${tool.logo}" alt="${tool.name} logo" loading="lazy" referrerpolicy="no-referrer">
          <div class="tool-name">${tool.name}</div>
        </div>
        <div class="tool-badges">${badges}</div>
      </div>
      <div class="tool-desc">${t(tool.desc)}</div>
      <div class="tool-detail">
        <div class="detail-row">
          <div class="detail-label">${uiText[currentLang].detailFit}</div>
          <div class="detail-val">${t(tool.fit)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">${uiText[currentLang].detailWhy}</div>
          <div class="detail-val">${t(tool.why)}</div>
        </div>
      </div>
    </div>
  `;
}

function renderOverview() {
  const grid = document.getElementById('overview-grid');
  const featured = categories.filter(cat => featuredOverviewIds.includes(cat.id));
  grid.innerHTML = featured.map(cat => `
    <div class="overview-card" style="--accent:${cat.accent};--accent-bg:${cat.accentBg}" onclick="switchTab('${cat.id}')">
      <div class="overview-icon">${cat.icon}</div>
      <div class="overview-text">
        <div class="overview-name">${t(cat.title)}</div>
        <div class="overview-sub">${overviewSummary[cat.id][currentLang]}</div>
      </div>
      <div class="overview-count">${cat.tools.length} ${uiText[currentLang].toolCount}</div>
    </div>
  `).join('');
}

function renderOverviewTable() {
  document.getElementById('overview-panel-title').textContent = uiText[currentLang].overviewPanelTitle;
  document.getElementById('overview-panel-sub').textContent = uiText[currentLang].overviewPanelSub;
  document.getElementById('overview-head-1').textContent = uiText[currentLang].overviewHead1;
  document.getElementById('overview-head-2').textContent = uiText[currentLang].overviewHead2;
  document.getElementById('overview-head-3').textContent = uiText[currentLang].overviewHead3;
  document.getElementById('overview-table-body').innerHTML = categories.map(cat => `
    <tr>
      <td>
        <div class="overview-row-cat" style="--accent:${cat.accent}">
          <span class="overview-row-dot"></span>
          <span class="overview-row-name">${t(cat.title)}</span>
        </div>
      </td>
      <td class="overview-row-desc">${overviewSummary[cat.id][currentLang]}</td>
      <td class="overview-row-picks">${overviewSummary[cat.id].picks}</td>
    </tr>
  `).join('');
}

function renderQuickGrid() {
  document.getElementById('quick-title').textContent = uiText[currentLang].quickTitle;
  document.getElementById('quick-grid').innerHTML = uiText[currentLang].quick.map(([q, a]) => `
    <div class="decision-card">
      <div class="decision-q">${q}</div>
      <div class="decision-a">${a}</div>
    </div>
  `).join('');
}

function renderSections() {
  const root = document.getElementById('sections-root');
  root.innerHTML = categories.map(cat => `
    <div id="tab-${cat.id}" class="section">
      <div class="section-header" style="--accent-bg:${cat.accentBg}">
        <div class="section-icon">${cat.icon}</div>
        <div>
          <div class="section-title">${t(cat.title)}</div>
          <div class="section-desc">${t(cat.desc)}</div>
        </div>
      </div>
      <div class="when-label">${uiText[currentLang].whenLabel}</div>
      <div class="when-chips">
        ${cat.chips[currentLang].map(item => `<span class="when-chip">${item}</span>`).join('')}
      </div>
      <div class="tool-grid">
        ${cat.tools.map(tool => toolCard(tool, cat.accent)).join('')}
      </div>
      <div class="decision-section">
        <div class="decision-title">${uiText[currentLang].decisionTitle}</div>
        <div class="decision-grid">
          ${cat.decisions[currentLang].map(([q, a]) => `

              <div class="decision-q">${q}</div>
              <div class="decision-a">${a}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = `
    <div class="nav-item active" data-tab="overview" onclick="switchTab('overview')">
      <span class="nav-dot" style="background:var(--slate-mid)"></span>${uiText[currentLang].overviewSection}
    </div>
    ${categories.map(cat => `
      <div class="nav-item" data-tab="${cat.id}" onclick="switchTab('${cat.id}')">
        <span class="nav-dot" style="background:${cat.accent}"></span>${t(cat.title)}
      </div>
    `).join('')}
  `;
}

function renderChrome() {
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('page-title').textContent = uiText[currentLang].title;
  document.getElementById('page-subtitle').textContent = uiText[currentLang].subtitle;
  document.getElementById('meta-block').innerHTML = uiText[currentLang].meta.replaceAll('\\n', '<br>');
  document.getElementById('featured-block-title').textContent = uiText[currentLang].featuredBlockTitle;
  document.getElementById('featured-block-sub').textContent = uiText[currentLang].featuredBlockSub;
  document.getElementById('hero-note-title-1').textContent = uiText[currentLang].hero1Title;
  document.getElementById('hero-note-body-1').textContent = uiText[currentLang].hero1Body;
  document.getElementById('hero-note-title-2').textContent = uiText[currentLang].hero2Title;
  document.getElementById('hero-note-body-2').textContent = uiText[currentLang].hero2Body;
  document.getElementById('hero-note-title-3').textContent = uiText[currentLang].hero3Title;
  document.getElementById('hero-note-body-3').textContent = uiText[currentLang].hero3Body;
  document.getElementById('footer-left').textContent = uiText[currentLang].footerLeft;
  document.getElementById('footer-mid').textContent = uiText[currentLang].footerMid;
  document.getElementById('footer-right').textContent = uiText[currentLang].footerRight;
}

function renderAll() {
  const active = document.querySelector('.nav-item.active')?.dataset.tab || 'overview';
  renderChrome();
  renderNav();
  renderOverviewTable();
  renderOverview();
  renderQuickGrid();
  renderSections();
  switchTab(active, false);
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });
}

function switchTab(tabId, scroll = true) {
  document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  const targetSection = document.getElementById(`tab-${tabId}`);
  if (targetSection) targetSection.classList.add('active');
  const targetNav = document.querySelector(`.nav-item[data-tab="${tabId}"]`);
  if (targetNav) {
    targetNav.classList.add('active');
    targetNav.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }
  if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    renderAll();
  });
});

renderAll();
</script>
